<!doctype html><html lang="nl"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/><meta name="theme-color" content="#20152b"/><title>Glam Studio</title><style>*{box-sizing:border-box}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:#160f20;color:#fff;margin:0}main{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(160deg,#2d1d3b,#1c1428 50%,#160f20)}header{padding:22px 20px 10px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:2px;color:#ffb8d3}.tag{font-size:10px;letter-spacing:1.5px;color:#a89ab6;border:1px solid #51405e;padding:7px;border-radius:20px}.hero{text-align:center;padding:5px 20px 16px}h1{font-size:29px;letter-spacing:-1px;margin:8px 0}.hero p{color:#c3b6cb;font-size:13px;margin:0}.stage{margin:0 17px;aspect-ratio:4/5;position:relative;background:radial-gradient(circle at 50% 40%,#745174,#32233f 75%);border:1px solid #74516d;border-radius:24px;overflow:hidden;box-shadow:0 20px 40px #08040b55}canvas{width:100%;height:100%;object-fit:contain;touch-action:none;display:none}#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px}.avatar{font-size:72px;background:#ffffff16;border-radius:50%;width:140px;height:140px;display:grid;place-items:center}#empty h2{font-size:22px;margin:18px 0 0}#empty p{font-size:13px;color:#d5c6d8;line-height:1.5}.primary{background:linear-gradient(90deg,#fa79ac,#dc448d);color:white!important;border:0!important;border-radius:13px;padding:14px 18px;font-weight:800;cursor:pointer;display:inline-block}.panel{padding:18px}.tools{display:flex;gap:7px;overflow:auto;padding-bottom:10px}.tools button{flex:1;min-width:65px;border:1px solid #5b4866;border-radius:14px;background:#372843;color:white;font-size:23px;padding:9px 5px;cursor:pointer}.tools button.active{border-color:#f883b1;background:#663a64}.tools small{display:block;font-size:10px;margin-top:4px}.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 18px}.swatches button{width:29px;height:29px;border-radius:50%;border:2px solid #ffffff45;cursor:pointer}.swatches button.selected{outline:2px solid white;outline-offset:3px}.control{margin:12px 0}.control label{display:flex;justify-content:space-between;font-size:13px;color:#d8cbdc}.control input{width:100%;accent-color:#f978ad;margin-top:10px}.hint{font-size:12px;color:#b9a8c4;line-height:1.5}.actions{display:flex;gap:7px;margin-top:16px}.actions button{flex:1;background:#3b2c47;border:1px solid #655171;border-radius:12px;color:white;font-size:12px;font-weight:700;padding:13px 5px;cursor:pointer}.change{display:block;text-align:center;margin-top:18px;font-size:12px;color:#e4a9c7;text-decoration:underline;cursor:pointer}footer{text-align:center;font-size:10px;color:#86748f;padding:12px 0 30px}
</style></head><body style="margin:0"><div id="app"></div><script>
const app=document.querySelector('#app');
app.innerHTML=`<main><header><span class="logo">✦ GLAM STUDIO</span><span class="tag">BEAUTY LAB</span></header><section class="hero"><h1>Make-up magic <span>✨</span></h1><p>Upload een portret en geef het jouw eigen look.</p></section><section class="stage"><canvas id="canvas" width="720" height="900"></canvas><div id="empty"><div class="avatar">💋</div><h2>Jouw beauty canvas</h2><p>Begin met een foto van voren, met goed licht.</p><label class="primary">📷 Kies een foto<input type="file" id="photo" accept="image/*" hidden></label></div></section><section class="panel"><div class="tools" id="tools"><button class="active" data-tool="lips">💋<small>Lippen</small></button><button data-tool="blush">🌸<small>Blush</small></button><button data-tool="shadow">✨<small>Ogen</small></button><button data-tool="liner">🖤<small>Liner</small></button><button data-tool="erase">🧽<small>Gum</small></button></div><div class="swatches" id="swatches"></div><div class="control"><label>Intensiteit <b id="opacityValue">45%</b></label><input id="opacity" type="range" min="10" max="100" value="45"></div><div class="control"><label>Kwastgrootte <b id="sizeValue">36</b></label><input id="size" type="range" min="8" max="90" value="36"></div><p class="hint">Tik of veeg over de foto om make-up aan te brengen. Zoom of verplaats je foto vooraf indien nodig.</p><div class="actions"><button id="undo">↶ Ongedaan</button><button id="before">👁 Voor / na</button><button id="save" class="primary">↓ Opslaan</button></div><label class="change">Andere foto kiezen<input type="file" id="photo2" accept="image/*" hidden></label></section><footer>GLAM STUDIO · prototype v0.1 · foto's blijven op je toestel</footer></main>`;
const canvas=document.querySelector('#canvas'),ctx=canvas.getContext('2d'),fileInputs=[document.querySelector('#photo'),document.querySelector('#photo2')];
let img=null,tool='lips',color='#cc315e',opacity=.45,size=36,strokes=[],current=null,showBefore=false,painting=false;
const colors=['#cc315e','#ed668b','#a52945','#8a3b69','#d68c74','#f4a5b7','#b66a9d','#7b5bba','#a66b4b','#26212b','#f2b8a1','#e74738'];
function draw(){ctx.clearRect(0,0,720,900);ctx.fillStyle='#e9dce7';ctx.fillRect(0,0,720,900);if(!img)return;const scale=Math.min(720/img.width,900/img.height),w=img.width*scale,h=img.height*scale;ctx.drawImage(img,(720-w)/2,(900-h)/2,w,h);if(showBefore)return;for(const stroke of [...strokes,...(current?[current]:[])]){ctx.save();ctx.globalCompositeOperation=stroke.tool==='erase'?'destination-out':'source-over';ctx.globalAlpha=stroke.tool==='erase'?1:stroke.opacity;ctx.strokeStyle=stroke.color;ctx.fillStyle=stroke.color;ctx.lineWidth=stroke.size*(stroke.tool==='liner'?.17:1);ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();stroke.points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));if(stroke.points.length===1){const p=stroke.points[0];ctx.arc(p.x,p.y,Math.max(1,ctx.lineWidth/2),0,Math.PI*2);ctx.fill()}else ctx.stroke();ctx.restore()}}
function coords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*900/r.height}}
canvas.addEventListener('pointerdown',e=>{if(!img)return;painting=true;canvas.setPointerCapture(e.pointerId);current={tool,color,opacity,size,points:[coords(e)]};draw()});canvas.addEventListener('pointermove',e=>{if(!painting)return;current.points.push(coords(e));draw()});function finish(){if(!painting)return;painting=false;strokes.push(current);current=null;draw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
for(const input of fileInputs)input.addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return;const url=URL.createObjectURL(f),image=new Image();image.onload=()=>{img=image;strokes=[];current=null;showBefore=false;document.querySelector('#empty').style.display='none';canvas.style.display='block';draw();URL.revokeObjectURL(url)};image.src=url;input.value=''});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b))});
const swatches=document.querySelector('#swatches');colors.forEach(c=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label',`Kleur ${c}`);b.className=c===color?'selected':'';b.onclick=()=>{color=c;swatches.querySelectorAll('button').forEach(x=>x.classList.toggle('selected',x===b))};swatches.append(b)});
for(const name of ['opacity','size'])document.querySelector('#'+name).oninput=e=>{if(name==='opacity'){opacity=+e.target.value/100;document.querySelector('#opacityValue').textContent=e.target.value+'%'}else{size=+e.target.value;document.querySelector('#sizeValue').textContent=size}};
document.querySelector('#undo').onclick=()=>{strokes.pop();draw()};document.querySelector('#before').onclick=()=>{showBefore=!showBefore;draw()};document.querySelector('#save').onclick=()=>{if(!img){alert('Upload eerst een foto.');return}const old=showBefore;showBefore=false;draw();const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='glam-studio-look.png';a.click();showBefore=old;draw()};
</script></body></html>
